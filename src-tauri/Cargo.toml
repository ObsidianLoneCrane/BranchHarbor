[package]
name = "branchharbor"
version = "0.1.0"
description = "A lightweight desktop workspace for Git repositories"
authors = ["ObsidianLoneCrane"]
license = "MIT"
edition = "2021"
rust-version = "1.99.1"

[lib]
name = "branchharbor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "=4.2.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "query", "native-tls"] }
rusqlite = { version = "=0.41.1", features = ["bundled"] }
zeroize = "=1.9.1"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
