[package]
name = "branchharbor"
version = "0.1.0"
description = "A lightweight desktop workspace for Git repositories"
authors = ["ObsidianLoneCrane"]
license = "MIT"
edition = "2021"
rust-version = "1.99.1"

[lib]
name = "branchharbor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
